<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videotron & Operator Wisuda</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      /* Background full cover */
      background-image: url('assets/images/Background.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #000;
      /* Neo-brutalism banyak pakai warna hitam pekat */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .title-image {
      position: absolute;
      top: 40px;
      max-width: 50%;
      /* Dikecilkan sedikit */
      z-index: 10;
    }

    /* --- NEO BRUTALISM STYLE --- */
    .card-wisudawan {
      background: #ffffff;
      /* Solid white background */
      border: 6px solid #000000;
      /* Border tegas tebal */
      border-radius: 16px;
      padding: 40px;
      width: 65%;
      /* Ukuran diperkecil */
      max-width: 850px;
      height: 360px;
      display: flex;
      align-items: center;
      gap: 40px;
      /* Hard shadow khas Brutalism (offset 15px, blur 0) */
      box-shadow: 18px 18px 0px #000000;
      z-index: 10;
      /* Dihapus margin-top, karena flex center sudah otomatis ke tengah layar vertikal/horizontal */
    }

    .foto-container {
      flex-shrink: 0;
      width: 240px;
      /* Diperkecil */
      height: 320px;
      border-radius: 8px;
      overflow: hidden;
      border: 6px solid #000000;
      box-shadow: 12px 12px 0px #000000;
      background-color: #f1c40f;
    }

    .foto-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex: 1;
      width: 100%;
      overflow: hidden;
    }

    .nama {
      font-size: 3rem;
      font-weight: 900;
      margin: 0 0 15px 0;
      line-height: 1.2;
      color: #000;
      /* text-wrap & word-wrap agar nama panjang turun ke bawah dengan rapi */
      text-wrap: balance;
      word-wrap: break-word;
      hyphens: auto;
      max-width: 100%;
      transition: font-size 0.3s ease;
    }

    .badges-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 1.2rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 8px 16px;
      border: 4px solid #000;
      box-shadow: 5px 5px 0px #000;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }

    .badge-predikat {
      background: #f1c40f;
      /* Kuning tegas */
    }

    .badge-ipk {
      background: #e74c3c;
      /* Merah tegas */
      color: #fff;
      /* Teks putih untuk kontras dengan merah */
    }

    .details-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 15px 20px;
      font-size: 1.3rem;
      background: #e2e8f0;
      /* Abu-abu solid */
      padding: 20px 25px;
      border-radius: 8px;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px #000;
    }

    .detail-label {
      color: #000;
      font-weight: 800;
    }

    .detail-label::after {
      content: ":";
      margin-left: 5px;
      float: right;
    }

    .detail-value {
      font-weight: 700;
      color: #000;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
    }

    /* INDIKATOR OPERATOR (Sangat Samar) */
    .kontrol-operator {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 30;
      font-size: 1rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.3);
      /* Putih sangat transparan */
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      /* Efek timbul tipis agar tetap terbaca operator */
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="card-wisudawan">
    <div class="foto-container">
      <img id="tampil-foto" src="" alt="Foto" />
    </div>
    <div class="info-container">
      <!-- Nama Lengkap termasuk gelar dipindah ke atas -->
      <h1 class="nama" id="tampil-nama">Memuat Data...</h1>

      <!-- Predikat & IPK digabung menjadi badge khas brutalism -->
      <div class="badges-container">
        <div class="badge badge-predikat" id="tampil-predikat">Memuat...</div>
        <div class="badge badge-ipk">IPK: <span id="tampil-ipk" style="margin-left: 6px;">-</span></div>
      </div>

      <!-- Grid Detail -->
      <div class="details-grid">
        <div class="detail-label">NRP</div>
        <div class="detail-value" id="tampil-nrp"></div>

        <div class="detail-label">Prodi</div>
        <div class="detail-value" id="tampil-prodi"></div>

        <div class="detail-label">Jurusan</div>
        <div class="detail-value" id="tampil-jurusan"></div>
      </div>
    </div>
  </div>

  <!-- INDIKATOR URUTAN OPERATOR -->
  <div class="kontrol-operator" id="teks-urutan">Menyiapkan...</div>

  <canvas id="canvasReaksi"></canvas>

  <!-- Mengambil data wisudawan dari file terpisah -->
  <script src="data.js"></script>

  <script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDJ__M-cf3mmNBfgMUz1gap4MiYDkDzieQ",
      authDomain: "live-reaction-1aa2b.firebaseapp.com",
      databaseURL:
        "https://live-reaction-1aa2b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "live-reaction-1aa2b",
      storageBucket: "live-reaction-1aa2b.firebasestorage.app",
      messagingSenderId: "816278406549",
      appId: "1:816278406549:web:404fdab279c6512be8229c",
      measurementId: "G-146S1736X5",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ==========================================
    // 1. DATA DIAMBIL DARI DATA.JS (Sudah Otomatis Teraplikasi)
    // ==========================================
    let indexSaatIni = 0;

    // ==========================================
    // 2. FUNGSI UNTUK MERENDER DATA KE LAYAR
    // ==========================================
    function renderWisudawan(index) {
      if (dataWisudawan.length === 0) return; // Cegah error jika data belum diload

      if (index < 0) indexSaatIni = 0;
      if (index >= dataWisudawan.length) indexSaatIni = dataWisudawan.length - 1;

      const profil = dataWisudawan[indexSaatIni];

      const namaElemen = document.getElementById("tampil-nama");
      namaElemen.innerText = profil.namaLengkap;

      // Pengecilan otomatis font untuk nama yang sangat panjang agar tetap rapi di card
      if (profil.namaLengkap.length > 45) {
        namaElemen.style.fontSize = "1.8rem";
      } else if (profil.namaLengkap.length > 25) {
        namaElemen.style.fontSize = "2.4rem";
      } else {
        namaElemen.style.fontSize = "3rem";
      }

      document.getElementById("tampil-nrp").innerText = profil.nrp;
      document.getElementById("tampil-prodi").innerText = profil.prodi;
      document.getElementById("tampil-jurusan").innerText = profil.jurusan;
      document.getElementById("tampil-predikat").innerText = profil.predikat;
      document.getElementById("tampil-ipk").innerText = profil.ipk;

      // Update Foto
      const imgElemen = document.getElementById("tampil-foto");
      if (profil.url_foto && profil.url_foto !== "") {
        imgElemen.src = profil.url_foto;
      } else {
        imgElemen.src = "https://placehold.co/300x400/2c3e50/ffffff?text=NO+IMAGE";
      }

      // Update indikator urutan untuk operator
      document.getElementById("teks-urutan").innerText =
        `Urutan: ${indexSaatIni + 1} dari ${dataWisudawan.length}`;

      // Otomatis kirim nama wisudawan ke HP audiens (Firebase)
      db.ref('status_layar').set({ nama_wisudawan: profil.namaLengkap });
    }

    renderWisudawan(indexSaatIni);

    // ==========================================
    // 3. KONTROL KEYBOARD (Slide PPT Style)
    // ==========================================
    window.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight") {
        indexSaatIni++;
        renderWisudawan(indexSaatIni);
      } else if (event.key === "ArrowLeft") {
        indexSaatIni--;
        renderWisudawan(indexSaatIni);
      }
    });

    // ==========================================
    // 4. ANIMASI CANVAS (Reaksi Live)
    // ==========================================
    const canvas = document.getElementById("canvasReaksi");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const MAX_PARTICLES = 150; // Pembatasan maksimal 150 emoji di layar sekaligus

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const reaksiRef = db.ref("reaksi_live");
    reaksiRef.on("child_added", (snapshot) => {
      const data = snapshot.val();

      // Jika jumlah emoji melebih batas, hapus yang paling pertama masuk
      if (particles.length > MAX_PARTICLES) {
        particles.shift();
      }

      particles.push({
        emoji: data.emoji,
        x: Math.random() * canvas.width,
        y: canvas.height + 50,
        speed: Math.random() * 3 + 2,
        size: Math.random() * 30 + 40,
        wobble: Math.random() * Math.PI,
        opacity: 1,
      });
      reaksiRef.child(snapshot.key).remove();
    });

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        p.y -= p.speed;
        p.x += Math.sin(p.wobble) * 2;
        p.wobble += 0.1;
        if (p.y < canvas.height / 3) {
          p.opacity -= 0.02;
        }
        ctx.globalAlpha = Math.max(p.opacity, 0);
        ctx.font = p.size + "px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(p.emoji, p.x, p.y);

        if (p.opacity <= 0 || p.y < -50) {
          particles.splice(i, 1);
          i--;
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>

</html>
